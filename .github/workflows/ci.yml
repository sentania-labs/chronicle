# Placement, decided per the lab's CI rule rather than by habit: this
# repository is private, but every job here either needs a Docker daemon
# (the three image builds) or needs nothing special (lint, test), so nothing
# uses `runs-on: lab`. Deploying Chronicle is lab-deployment's job, on the far
# side of publication.
#
# This round (C0) only lints, tests, and proves the three images build.
# Image signing, SBOM generation, publishing, and release-from-tag jobs
# follow coppermind's ci.yml shape and arrive in round C6, once there is
# something worth releasing.
#
# Every job that fires on pull_request carries the sentania-labs fork gate,
# so a fork's pull request cannot run privileged steps under this repo's
# context.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: make setup
      - run: make lint
      - run: make typecheck
      - run: make prose-check

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: make setup
      - run: make test

  # Builds only, no push: proves the three targets build from this single
  # Dockerfile. Publishing arrives in C6.
  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, builder, preview]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          tags: chronicle/${{ matrix.target }}:ci
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
