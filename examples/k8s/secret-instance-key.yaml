# Reference only, not the lab's deployment. See README.md in this directory.
#
# Placeholder shape for the instance key that encrypts the GitHub App
# credentials and other secrets at rest (spec section 11 and 13). Never
# commit a real key: generate one per instance and manage it the way the
# rest of the cluster's secrets are managed (sealed-secrets, external-secrets,
# or a manual `kubectl create secret` at deploy time).
apiVersion: v1
kind: Secret
metadata:
  name: chronicle-instance-key
  labels:
    app.kubernetes.io/name: chronicle
type: Opaque
stringData:
  # A hyphenated key name is not a valid environment variable name; kubelet
  # silently drops it from envFrom and the pod starts with no instance key at
  # all. Keep this an upper-snake-case name so envFrom actually delivers it.
  CHRONICLE_INSTANCE_KEY: "REPLACE_ME_GENERATE_A_REAL_KEY_PER_INSTANCE"
