# Reference only, not the lab's deployment. See README.md in this directory.
#
# Internal-only by convention (no public DNS is ever wired to Chronicle from
# this repo). Root path goes to api (service, UI, admin); /preview goes to
# preview (spec section 7 and 14). ingressClassName and host are cluster
# specifics left for the deployer.
#
# Two Ingress objects, not one: a path-rewrite annotation applies to every
# path in the object, not just the one that declares a capture group, so
# combining both routes under one annotated Ingress would rewrite the api's
# root path too.
#
# No rewrite on the preview path, unlike C0's placeholder version of this
# file: chronicle/preview/main.py (C3) matches on the literal `/preview/`
# prefix itself, because Hugo's own `--baseURL` for a build (chronicle/
# builder/hugo.py) bakes that same prefix into every absolute link the build
# emits. Stripping the prefix here would make the ingress and the HTML
# disagree about where a preview's own assets live.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chronicle-api
  labels:
    app.kubernetes.io/name: chronicle
spec:
  ingressClassName: REPLACE_ME_internal
  rules:
    - host: chronicle.REPLACE_ME.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chronicle
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chronicle-preview
  labels:
    app.kubernetes.io/name: chronicle
spec:
  ingressClassName: REPLACE_ME_internal
  rules:
    - host: chronicle.REPLACE_ME.internal
      http:
        paths:
          - path: /preview
            pathType: Prefix
            backend:
              service:
                name: chronicle
                port:
                  number: 8090
