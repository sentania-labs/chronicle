# Reference only, not the lab's deployment. See README.md in this directory.
#
# One Deployment, three containers in one pod (spec section 14): api,
# builder, and preview. `data` backs the durable record (api and builder
# only: `preview` has no business reading it, tokens and the instance key
# included). `preview-site` backs `site` and `preview`, shared by all three
# so the api's digest, the builder's read of the same clone, and the
# preview server's read of the builder's output are always the same
# storage, never three independent copies of it (see the C3 pull request
# for the bug this deployment shipped with when only api and builder
# mounted the `site` subPath, and preview only ever saw its own copy of
# `preview`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronicle
  labels:
    app.kubernetes.io/name: chronicle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chronicle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chronicle
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: REPLACE_ME/chronicle/api:REPLACE_ME
          ports:
            - containerPort: 8080
          env:
            - name: CHRONICLE_DATA_DIR
              value: /data
            - name: CHRONICLE_EXTERNAL_URL
              value: https://chronicle.REPLACE_ME.internal
          envFrom:
            - secretRef:
                name: chronicle-instance-key
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data
            - name: preview-site
              mountPath: /data/site
              subPath: site
            - name: tmp
              mountPath: /tmp
            # Scheduled backups' local-path target (ADR 024); set
            # /admin/backup's directory to /backups. api only.
            - name: backups
              mountPath: /backups
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

        - name: builder
          image: REPLACE_ME/chronicle/builder:REPLACE_ME
          env:
            - name: CHRONICLE_DATA_DIR
              value: /data
            - name: CHRONICLE_EXTERNAL_URL
              value: https://chronicle.REPLACE_ME.internal
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data
            - name: preview-site
              mountPath: /data/site
              subPath: site
            - name: preview-site
              mountPath: /data/preview
              subPath: preview
            - name: tmp
              mountPath: /tmp
            # Hugo's cache, its resource dir, and the scratch tree it builds
            # from (chronicle/builder/settings.py's work_dir) all need to be
            # writable; data/builder-work sits on the data volume above, so
            # this mount is only for the image's own home directory, which
            # the read-only root filesystem otherwise makes unwritable.
            - name: builder-home
              mountPath: /home/chronicle
          # No HTTP port to probe: liveness is the heartbeat file
          # chronicle/builder/runner.py writes every poll tick, checked by
          # `chronicle-builder --healthcheck` (chronicle/builder/main.py),
          # not an inline script here: the staleness rule lives in one
          # place a test can import and exercise, not copy-pasted into this
          # manifest a second time.
          livenessProbe:
            exec:
              command:
                - chronicle-builder
                - --healthcheck
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

        - name: preview
          image: REPLACE_ME/chronicle/preview:REPLACE_ME
          ports:
            - containerPort: 8090
          env:
            - name: CHRONICLE_PREVIEW_DIR
              value: /data/preview
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: preview-site
              mountPath: /data/preview
              subPath: preview
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chronicle-data
        - name: preview-site
          persistentVolumeClaim:
            claimName: chronicle-preview-site
        - name: backups
          persistentVolumeClaim:
            claimName: chronicle-backups
        - name: tmp
          emptyDir: {}
        - name: builder-home
          emptyDir: {}
