# Reference only, not the lab's deployment. See README.md in this directory.
#
# Fronts the single Deployment's api and preview ports so ingress.yaml has
# something to route to.
apiVersion: v1
kind: Service
metadata:
  name: chronicle
  labels:
    app.kubernetes.io/name: chronicle
spec:
  selector:
    app.kubernetes.io/name: chronicle
  ports:
    - name: api
      port: 8080
      targetPort: 8080
    - name: preview
      port: 8090
      targetPort: 8090
