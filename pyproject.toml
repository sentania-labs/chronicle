# Single package, three console scripts, one image per script's runtime
# shape (api, builder, preview). Unlike coppermind this is not a uv
# workspace: Chronicle ships one package, so one toolchain configuration
# needs no workspace member list to stay in sync with.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronicle"
version = "0.1.0.dev0"
description = "Chronicle: carries a piece of writing from an author to the public blog"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Imported directly in chronicle/api/main.py, not just pulled in
    # transitively by fastapi: declare it so a fastapi release that changes
    # its own pydantic pin cannot silently break this import.
    "pydantic>=2.7",
    # Multipart bodies for the image upload route.
    "python-multipart>=0.0.9",
    # Decodes an upload to decide its real type and re-encodes it without
    # metadata, so the filename extension is never trusted.
    "pillow>=10.3",
    # Admin password hashing (a human-chosen, low-entropy secret): argon2 is
    # deliberately different from the plain sha256 ADR 007 uses for consumer
    # tokens, which are 256-bit CSPRNG values with nothing for a KDF to slow.
    "argon2-cffi>=23.1",
    # Encrypts the GitHub App private key, client secret, and webhook secret
    # at rest under the instance key (ADR 008).
    "cryptography>=42",
    # Signs the App JWT (RS256) used to authenticate to GitHub as the App
    # itself, before an installation token exists.
    "pyjwt>=2.8",
    # The GitHub client and the digest command both make outbound HTTPS
    # calls; httpx's base_url and transport options are what let tests point
    # both at a mock instead of the network.
    "httpx>=0.27",
    # Post frontmatter on the real blog is YAML between `---` fences; TOML
    # frontmatter (`+++`) is parsed with the stdlib's tomllib instead.
    "pyyaml>=6.0",
]

[project.scripts]
chronicle = "chronicle.cli:main"
chronicle-api = "chronicle.api.main:run"
chronicle-builder = "chronicle.builder.main:run"
chronicle-preview = "chronicle.preview.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["chronicle"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependencies idiomatically use Depends(...) and Header(...) as defaults.
"chronicle/api/*.py" = ["B008"]
# Hand-written HTML template strings read worse forced onto multiple lines
# than left as one row per markup line, the same tradeoff admin_templates.py
# already accepts implicitly by staying just under the limit.
"chronicle/api/ui_templates.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
