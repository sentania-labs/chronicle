# Single package, three console scripts, one image per script's runtime
# shape (api, builder, preview). Unlike coppermind this is not a uv
# workspace: Chronicle ships one package, so one toolchain configuration
# needs no workspace member list to stay in sync with.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronicle"
version = "0.1.0.dev0"
description = "Chronicle: carries a piece of writing from an author to the public blog"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Imported directly in chronicle/api/main.py, not just pulled in
    # transitively by fastapi: declare it so a fastapi release that changes
    # its own pydantic pin cannot silently break this import.
    "pydantic>=2.7",
]

[project.scripts]
chronicle-api = "chronicle.api.main:run"
chronicle-builder = "chronicle.builder.main:run"
chronicle-preview = "chronicle.preview.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["chronicle"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependencies idiomatically use Depends(...) and Header(...) as defaults.
"chronicle/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
