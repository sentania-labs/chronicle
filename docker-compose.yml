# Local development only. This is not how Chronicle is deployed: the lab's
# reference manifests are in examples/k8s/, and lab-deployment owns the real
# instance. This file exists so `make compose-up` gives a developer the three
# images talking to each other on a laptop, preview link included.
#
#   docker compose up -d
#
# To point the digest at a local clone instead of a real GitHub App (this is
# how the C3 live check exercised the whole preview path), set
# CHRONICLE_DIGEST_REPO_URL to a filesystem path before starting:
#
#   CHRONICLE_DIGEST_REPO_URL=/path/to/a/local/clone docker compose up -d
#
# CHRONICLE_EXTERNAL_URL below points at the preview container's own port
# (8090), not the api's (8080), so a preview_url the api returns is directly
# clickable in this compose shape. That is the wrong value for the two
# browser steps of the GitHub App manifest flow (they redirect back to the
# api); exercising those locally means overriding it back to
# http://localhost:8080 for that one session.
name: chronicle

services:
  api:
    build:
      context: .
      target: api
    environment:
      CHRONICLE_DATA_DIR: /data
      CHRONICLE_EXTERNAL_URL: http://localhost:8090
      CHRONICLE_DIGEST_REPO_URL: ${CHRONICLE_DIGEST_REPO_URL:-}
    volumes:
      - data:/data
      - preview:/data/preview
    ports:
      - "127.0.0.1:8080:8080"

  builder:
    build:
      context: .
      target: builder
      args:
        HUGO_VERSION: ${HUGO_VERSION:-0.164.0}
    environment:
      CHRONICLE_DATA_DIR: /data
      CHRONICLE_EXTERNAL_URL: http://localhost:8090
    volumes:
      - data:/data
      - preview:/data/preview

  preview:
    build:
      context: .
      target: preview
    environment:
      CHRONICLE_PREVIEW_DIR: /data/preview
    volumes:
      - preview:/data/preview
    ports:
      - "127.0.0.1:8090:8090"

# `preview` is its own volume, mounted at /data/preview in all three
# containers, so the preview container's tree is exactly what the builder
# just wrote and never anything else under /data: state/tokens.json,
# state/github-app.json, and state/instance.key never reach a container
# that has no business opening them. `data` carries everything else,
# including data/site, so the api's digest and the builder's own read of
# the same clone are the same files, not two independent copies.
# No `user:` override on any service: a fresh named volume is initialised
# by Docker from the image's own content and ownership at the mount path,
# so `data` and `preview` come up owned by uid 1000 because the Dockerfile
# creates and chowns /data and /data/preview before USER 1000 in every
# stage that mounts them. If a future stage adds a new mount point, that
# ownership has to be set in the image the same way, not patched here.
volumes:
  data:
  preview:
